name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test test/unit.test.mjs

  smoke:
    name: mcp handshake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the desktop engine
        run: npm i -g agent-desktop --no-audit --no-fund

      # Windows is the authoritative handshake: it has a real desktop session and
      # is the platform where the `.cmd` shim trap lives.
      - name: initialize + tools/list (Windows)
        if: runner.os == 'Windows'
        run: node test/smoke.mjs

      # Hosted Linux runners are headless; Xvfb gives the engine an X server so the
      # handshake can be attempted. Kept non-blocking: display availability varies.
      - name: initialize + tools/list (Linux, under Xvfb)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          xvfb-run -a node test/smoke.mjs

      # Hosted macOS runners have no Accessibility grant, so the engine may refuse
      # tools; the point of this step is only to prove the binary starts and speaks MCP.
      - name: initialize + tools/list (macOS, no Accessibility grant)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: node test/smoke.mjs